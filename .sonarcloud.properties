# SonarQube Cloud (automatic analysis) — what counts as the TrackNGo application.
# Anything outside these folders (Areas/ ASP.NET mock-ups, scratch/ test scripts, one-off root scripts,
# public/ build output) is not part of the Laravel app and is not analysed.
sonar.sources=app,bootstrap,config,database,resources,routes
sonar.tests=tests

# Framework caches and route helpers generated by Wayfinder during the build
sonar.exclusions=bootstrap/cache/**,resources/js/actions/**,resources/js/routes/**,resources/js/wayfinder/**

# Migrations repeat column definitions by design
sonar.cpd.exclusions=database/migrations/**
