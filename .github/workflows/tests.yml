name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          # composer.lock needs PHP 8.4.1+ (Laravel 13 with Symfony 8.1)
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      # Installs dependencies, runs the migrations and builds the frontend
      - name: Setup Application
        run: composer setup

      - name: Run tests
        run: php artisan test

      # Advisory: reported in the log but not failing the build yet. The codebase predates these
      # checks (they came with the Laravel starter kit); drop continue-on-error once each one passes.
      - name: ESLint (advisory)
        continue-on-error: true
        run: npm run lint:check

      - name: Prettier (advisory)
        continue-on-error: true
        run: npm run format:check

      - name: TypeScript (advisory)
        continue-on-error: true
        run: npm run types:check

      - name: Pint (advisory)
        continue-on-error: true
        run: vendor/bin/pint --test

      - name: PHPStan (advisory)
        continue-on-error: true
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
